gaps:
- No security.txt (RFC 9116) on any Flume-controlled host.
- No published vulnerability disclosure policy or bug bounty.
- No trust portal — certifications are named in marketing copy only, with no evidence artifact behind them.
- Contract is Swagger 2.0; no OpenAPI 3.x, no AsyncAPI, no event/webhook surface.
