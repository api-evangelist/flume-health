source: live unauthenticated GET of /.well-known/* on every Flume Health host named in apis.yml
note: >-
  Flume Health serves three real /.well-known/ documents, all of them OAuth/OIDC metadata. The Flume Console
  advertises RFC 9728 protected-resource metadata for its Model Context Protocol endpoint, and auth.flumehealth.com
  (an Auth0 tenant on Flume's own domain) serves OAuth 2.0 authorization-server metadata, an identical OpenID
  Connect discovery document, and a JWKS. No security.txt, api-catalog, ai-plugin.json, or A2A agent card is served
  on any host. IMPORTANT: console.flumehealth.com is a single-page app whose catch-all returns HTTP 200 with a
  1,107-byte HTML shell for most unknown paths — every 200 recorded below as `spa-shell` is that shell, NOT a
  document, and is treated as a miss. The security.txt served at status.flumehealth.com is Atlassian Statuspage's
  own (Canonical: https://www.atlassian.com/.well-known/security.txt) and is NOT Flume's, so it is recorded as a
  third-party document and earns Flume nothing.
hits: 3
