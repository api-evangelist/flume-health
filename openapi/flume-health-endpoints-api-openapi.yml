        - openid
        - profile
        - email
  /api/v1/endpoints/datatypes/{datatype}:
    get:
      description: Gets the information for a specific datatype that can be used in an endpoint mapping.
      tags:
      - Endpoints
      summary: Get Endpoint Datatype
      operationId: getEndpointDataType
      parameters:
      - description: name of the datatype
        name: datatype
        in: path
        required: true
        schema:
          type: string
          enum:
          - Accumulators
          - Authorizations
          - Bytes
          - Eligibility
          - Groups
          - MedicalClaimServiceLines
          - Providers
          - RxClaimServiceLines
          - MedicalAndRxClaimLines
          - Test
          - TransactionMetadata
          - Generic
          - RecordLevelMetadata
          - PlanNetworks
          - ProviderNetworkDirectory
          - HmClaimsExtended
          - HmProvidersExtended
          - Strings
      - description: X-Flume-Account-ID
        name: X-Flume-Account-ID
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/datatypes.DataType'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - OAuth2Implicit:
        - openid
        - profile
        - email
