components:
  schemas:
    endpoint.MapType:
      type: string
      enum:
      - SQL
      - Python
      - DuckDB
      x-enum-varnames:
      - MapTypeSql
      - MapTypePython
      - MapTypeDuckDB
    endpoint.DataType:
      type: string
      enum:
      - Accumulators
      - Authorizations
      - Bytes
      - Eligibility
      - Groups
      - MedicalClaimServiceLines
      - Providers
      - RxClaimServiceLines
      - MedicalAndRxClaimLines
      - Test
      - TransactionMetadata
      - Generic
      - RecordLevelMetadata
      - PlanNetworks
      - ProviderNetworkDirectory
      - HmClaimsExtended
      - HmProvidersExtended
      - Strings
      x-enum-varnames:
      - DataTypeAccumulators
      - DataTypeAuthorizations
      - DataTypeBytes
      - DataTypeEligibility
      - DataTypeGroups
      - DataTypeMedicalClaimServiceLines
      - DataTypeProviders
      - DataTypeRxClaimServiceLines
      - DataTypeMedicalAndRxClaimLines
      - DataTypeTest
      - DataTypeTransactionMetadata
      - DataTypeGeneric
      - DataTypeRecordLevelMetadata
      - DataTypePlanNetworks
      - DataTypeProviderNetworkDirectory
      - DataTypeHmClaimsExtended
      - DataTypeHmProvidersExtended
      - DataTypeStrings
    database.Engine:
      type: string
      enum:
      - PostgreSQL
      - MicrosoftSQLServer2019
      - MicrosoftSQLServer2022
      - Oracle
      x-enum-varnames:
      - EnginePostgreSQL
      - EngineMicrosoftSQLServer2019
      - EngineMicrosoftSQLServer2022
      - EngineOracle
    sorting.Method:
      type: string
      enum:
      - Default
      - FileName
      - LastModified
      x-enum-varnames:
      - MethodDefault
      - MethodFileName
      - MethodLastModified
    endpoint.WorkerSize:
      type: string
      enum:
      - small
      - medium
      - large
      - xlarge
      - max
      x-enum-varnames:
      - WorkerSizeSmall
      - WorkerSizeMedium
      - WorkerSizeLarge
      - WorkerSizeXLarge
      - WorkerSizeMax
    database.DatabaseMap:
      type: object
      properties:
        map:
          type: string
        name:
          type: string
        ordinal:
          type: integer
    endpoint.FileUpdate:
      type: object
      properties:
        duckDb:
          allOf:
          - $ref: '#/components/schemas/duckdb.Config'
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/endpoint.Field'
        filterPattern:
          type:
          - string
          - 'null'
        filterType:
          allOf:
          - $ref: '#/components/schemas/endpoint.FileFilterType'
        headerRow:
          type:
          - integer
          - 'null'
        headerless:
          type:
          - boolean
          - 'null'
        map:
          type:
          - string
          - 'null'
        mapType:
          allOf:
          - $ref: '#/components/schemas/endpoint.MapType'
        nameTemplate:
          type:
          - string
          - 'null'
        recordStartRow:
          type:
          - integer
          - 'null'
        skipLinesBottom:
          type:
          - boolean
          - 'null'
        skipLinesTop:
          type:
          - boolean
          - 'null'
        trailerRowCount:
          type:
          - integer
          - 'null'
        type:
          allOf:
          - $ref: '#/components/schemas/endpoint.FileType'
    flumelakehouse.WriteModel:
      type: object
      properties:
        credentialType:
          $ref: '#/components/schemas/flumelakehousecredentials.CredentialType'
        credentials:
          $ref: '#/components/schemas/flumelakehousecredentials.FlumeLakehouseCredentials'
        maps:
          type: array
          items:
            $ref: '#/components/schemas/flumelakehouse.FlumeLakehouseMap'
    endpoint.EndpointType:
      type: string
      enum:
      - Destination
      - Source
      x-enum-varnames:
      - EndpointTypeDestination
      - EndpointTypeSource
    secret.ApiFlumeLakehouseSecret:
      type: object
      properties:
        name:
          type: string
        value:
          $ref: '#/components/schemas/flumelakehousecredentials.FlumeLakehouseCredentials'
    secret.ApiEncryptionSecret:
      type: object
      properties:
        passphrase:
          $ref: '#/components/schemas/secret.ApiSecret'
        privateKey:
          $ref: '#/components/schemas/secret.ApiSecret'
    flumelakehousecredentials.FlumeLakehouseCredentials:
      type: object
      properties:
        catalogConfigs:
          type: array
          items:
            $ref: '#/components/schemas/flumelakehousecredentials.CatalogConfig'
    endpoint.State:
      type: string
      enum:
      - Idle
      - Running
      - Error
      - Stopped
      x-enum-varnames:
      - StateIdle
      - StateRunning
      - StateError
      - StateStopped
    endpoint.LambdaResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    database.WriteModel:
      type: object
      properties:
        database:
          type: string
        engine:
          $ref: '#/components/schemas/database.Engine'
        host:
          type: string
        maps:
          type: array
          items:
            $ref: '#/components/schemas/database.DatabaseMap'
        orderBy:
          type: string
        pageSize:
          type: integer
        port:
          type: integer
        protocol:
          type: string
        secret:
          type: string
        secretType:
          $ref: '#/components/schemas/secret.SecretType'
        username:
          type: string
    datatypes.Field:
      type: object
      properties:
        column:
          type: string
        deprecated:
          type: boolean
        fieldType:
          $ref: '#/components/schemas/datatypes.FieldType'
        name:
          type: string
    flumelakehouse.ReadModel:
      type: object
      properties:
        credentialType:
          $ref: '#/components/schemas/flumelakehousecredentials.CredentialType'
        maps:
          type: array
          items:
            $ref: '#/components/schemas/flumelakehouse.FlumeLakehouseMap'
        secretName:
          type: string
    duckdb.File:
      type: object
      required:
      - tableName
      properties:
        fileNamingConvention:
          type: string
        tableName:
          type: string
    flumelakehouse.UpdateModel:
      type: object
      properties:
        credentialType:
          allOf:
          - $ref: '#/components/schemas/flumelakehousecredentials.CredentialType'
        credentials:
          allOf:
          - $ref: '#/components/schemas/flumelakehousecredentials.FlumeLakehouseCredentials'
        maps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/flumelakehouse.FlumeLakehouseMap'
    endpoint.Protocol:
      type: string
