  /api/v1/context/knowledge:reorganize:
    post:
      description: 'Applies a plan: creates its new areas, then files each entry under its area with the same single-parent move :place makes. A new area whose title matches an active area is reused, so a retry does not create a second copy. The whole plan is validated first and refused on a shape error; after that a failure on one area or entry is reported in errors and the rest of the plan still runs. At most 200 assignments and 40 new areas per call. With dry_run the plan is validated and counted and nothing is written. Curator-gated.'
      tags:
      - Context Knowledge
      summary: Apply a reorganization plan
      operationId: applyKnowledgeReorganize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledgemanager.ReorganizeResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/knowledgemanager.ApplyReorganizeInput'
        description: The accepted plan
        required: true
  /api/v1/context/knowledge:reorganize-propose:
    post:
      description: 'Reads the entries filed under Unfiled (or directly under from_section_fqn) and asks the assistant for a plan: new areas to create and one area per entry. Writes nothing. The plan is a draft: lines that name an entry or area that does not exist are dropped and counted, and entries the plan leaves out are listed as unassigned. At most 200 entries are covered per call; remaining says how many were left. Curator-gated.'
      tags:
      - Context Knowledge
      summary: Propose a knowledge reorganization
      operationId: proposeKnowledgeReorganize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledgemanager.ReorganizeProposal'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/knowledgemanager.ProposeReorganizeInput'
        description: Which entries to reorganize
        required: true
  /api/v1/context/knowledge:save:
    post:
      description: 'Saves an answer from chat to the account''s knowledge, filed under an area. The caller does not choose the outcome: the manager decides from the caller''s role. An Admin''s save publishes (outcome=publish). An Editor''s save becomes a proposal an Admin approves (outcome=propose). A Viewer is refused (403). area_fqn must be an active area the caller can read; otherwise the save is refused and nothing is written. The body has no status, proposed_target or supersedes_fqn field, and an unknown field is refused.'
      tags:
      - Context Knowledge
      summary: Save a chat answer to knowledge
      operationId: saveKnowledge
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledgemanager.SaveKnowledgeResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/knowledgemanager.SaveKnowledgeInput'
        description: Answer to save
        required: true
  /api/v1/context/knowledge:set-publishing-policy:
    post:
      description: 'Sets whether knowledge changes need review (FL-32297). review_required (the default): Admins publish, and Editors'' changes become proposals an Admin approves. writers_publish: Admins and Editors publish directly. Viewers cannot change knowledge in either mode. Admins only. Every change is recorded in the account''s graph with who, when, from and to. It takes effect on the next write.'
      tags:
      - Context Knowledge
      summary: Set the account's knowledge publishing policy
      operationId: setKnowledgePublishingPolicy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledgemanager.PublishingPolicyChange'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/knowledge.SetPublishingPolicyRequest'
        description: The policy to set
        required: true
components:
  schemas:
    knowledge.KnowledgePrefixResponse:
      type: object
      properties:
        index:
          $ref: '#/components/schemas/knowledge.KnowledgePrefixBlock'
        ontology:
          $ref: '#/components/schemas/knowledge.KnowledgePrefixBlock'
    knowledgestore.ArtifactKind:
      type: string
      enum:
      - code
      - document
      - image
      x-enum-varnames:
      - ArtifactKindCode
      - ArtifactKindDocument
      - ArtifactKindImage
    knowledge.ConflictEdgeRef:
      type: object
      properties:
        other_fqn:
          type: string
    knowledgemanager.CreateKnowledgeInput:
      type: object
      required:
      - description
      - kind
      - knowledge_scope_type
      - title
      properties:
        applicability:
          type: string
        authored_by:
          type: string
        body:
          type: string
        confidence:
          type: number
        description:
          type: string
        kind:
          type: string
        knowledge_scope_id:
          description: 'ScopeID is required for the project, user, and session scopes (each names a

            specific subject) and MAY be empty for account (defaults to the request-context

            account) and flume_core (global, no id). See Validate.'
          type: string
        knowledge_scope_type:
          $ref: '#/components/schemas/knowledgestore.KnowledgeScopeType'
        proposed_target:
          description: 'ProposedTarget is the attachment target the proposer named, as TEXT. Required to

            approve (FR-27 "resolved attachment target"). It is deliberately neither of the

            two things it resembles: not an :APPLIES_TO edge (attach needs a RESOLVED fqn,

            and a proposer has not resolved anything), and not Applicability (which is prose

            about WHEN the knowledge applies, not WHAT it attaches to). Resolution is the

            curator''s job on the manage surface before approval.'
          type: string
        recall_policy:
          $ref: '#/components/schemas/knowledgestore.RecallPolicy'
        sensitivity:
          description: 'Sensitivity is the proposer''s PHI classification (none | phi_adjacent |

            phi_bearing). Required to approve (FR-27 "sensitivity classification"); an

            unclassified entity is not injectable (PHI policy §4).'
          type: string
          example: none
        source_refs:
          type: array
          items:
            type: string
        source_type:
          type: string
        status:
          $ref: '#/components/schemas/knowledgestore.KnowledgeStatus'
        supersedes_fqn:
          description: 'SupersedesFQN is the predecessor a draft carries (FL-31264, spec-e4-wiki-edit-loop

            Part 3 gap 2, CT8). It is accepted ONLY on a status=proposed create — a proposal

            "lands as a supersede" but must not link + flip the predecessor until a curator

            approves it (AD-3: a curator publishes; the predecessor stays active and readable

            until then), so :supersede''s proposed-status branch holds this on the review row

            instead of calling Manager.Supersede. promoteProposal runs the actual link + flip

            inside the SAME approve call the predecessor''s status was frozen against

            (Q1, decided 2026-09-15: one act, approval runs the supersede).


            It is the literal wire name a context-workspace lane (FL-31295) is building

            against tonight without seeing this code — do not rename it.'
          type: string
          example: knowledge/019f8899-d6c2-761f-9019-4ad5e8167402
        tags:
          type: array
          items:
            type: string
        title:
          type: string
        valid_from:
          type: string
        valid_to:
          type: string
        verification_interval:
          description: 'VerificationInterval is the re-verification cadence (an ISO-8601 duration string

            such as "P90D" — see knowledgestore.Duration), required to approve (FR-27

            "verification interval").


            It is accepted at PROPOSE time, which is a deviation worth stating: it is an

            approver-shaped decision, and the natural home would be the approve request. But

            the review-queue''s approve is a bodyless POST by contract, so with no create-time

            field a proposal could carry no interval by any route the SPA has, and every

            promotion would block on missing evidence permanently. The approve route still

            accepts an override, so the approver keeps the final say; this field is what

            lets the proposal arrive with a defensible default already on it.'
          type: string
          example: P90D
    knowledge.BaseHistoryEdit:
      type: object
      properties:
        after:
          type: object
          additionalProperties: {}
        before:
          type: object
          additionalProperties: {}
        edited_at:
          type: string
        edited_by:
          description: 'EditedBy is the editor''s resolved DISPLAY NAME (FL-31650), never an email or a

            raw id; omitted when unresolved.'
          type: string
        fields:
          type: array
          items:
            type: string
        id:
          type: string
    knowledge.UIStatePayload:
      type: object
      properties:
        can_curate:
          description: 'CanCurate reports whether this caller passes the curator gate

            (authz.KnowledgeCurate): a Flume system admin, or the account''s own Admin. It is

            what the SPA gates its curation surfaces on INSTEAD of the client-side

            isSystemAdmin check, which would keep an account''s own Admins looking at a

            read-only UI.


            SERVER-COMPUTED FROM THE SAME PREDICATE THAT REFUSES WRITES, deliberately.

            It is knowledgemanager.CanCurate, defined as RequireCurator returning nil, so

            the answer the client renders and the answer the write path enforces cannot

            disagree. Recomputing the role-and-flag rules here — or in the client — would

            make a UI that offers a button the API then refuses, or hides one it would

            have allowed, the first time either side changed.


            It is a HINT, not a permission. Nothing trusts the client to honor it: every

            curator write is gated in the manager regardless of what this said.


            A restricted account''s own user gets the SAME computed answer as anyone

            else (FL-31440): the write path admits an Admin on a staff-only account, so

            the zero value would tell them they cannot curate when they can. See the

            handler for why serving the real answer discloses nothing.'
          type: boolean
        knowledge_publishing:
          description: 'KnowledgePublishing is the account''s knowledge publishing policy (FL-32297):

            review_required or writers_publish. Omitted when the policy could not be read.'
          enum:
          - review_required
          - writers_publish
          allOf:
          - $ref: '#/components/schemas/knowledgemanager.KnowledgePublishing'
        write_decision:
          description: 'WriteDecision is what happens to this caller''s knowledge change on this

            account: publish (it goes live) or propose (an Admin reviews it). It is

            knowledgemanager.DecideKnowledgeWrite, the same function the write path

            applies, so the sentence the SPA shows ("Your changes publish immediately" or

            "Your changes go to an Admin for review") cannot disagree with what a write

            does. Omitted when the caller may not write knowledge or the decision could

            not be made.'
          enum:
          - publish
          - propose
          allOf:
          - $ref: '#/components/schemas/knowledgemanager.PublishDecision'
    knowledgemanager.BulkItem:
      type: object
      required:
      - payload
      properties:
        inheritance:
          $ref: '#/components/schemas/knowledgestore.InheritanceMode'
        payload:
