  /api/v1/context/knowledge/review-items/{review_item_id}:approve:
    post:
      description: 'Disposes a review row as accepted. On a proposed_knowledge row this is ONE call that does BOTH halves of the promotion: it promotes the entity proposed->active (emitting the `approved` event) and disposes the row open->accepted. They are one call because the two writes span different datasets with no shared transaction, so the sequencing has to be the server''s — a client issuing two calls would own a half-applied promotion it cannot repair. On a bulk_seed_ambiguity or feedback_flag row there is no entity to promote, so it is queue bookkeeping only. Promotion enforces the FR-27 evidence floor AND the artifact-freshness re-check, refusing with 400 invalid_input and a `field` naming what blocked it (`artifacts` for a revised or unconfirmable artifact, `section_fqn` for a non-section entry, otherwise the missing evidence field) — a `section_fqn` naming NO entry at all refuses 404 not_found instead, the same split `:place` draws. A refused promotion writes NOTHING. Knowledge-hierarchy placement (FL-31444, D37): an entry that ends up filed nowhere — no `section_fqn` override, no inherited or resolved target, no curator pre-approval filing — lands in Unfiled under the account root, and the response''s `placement` field says so ("Placed in Unfiled"); it is empty when the entry resolved a real placement of its own. CURATOR-gated.'
