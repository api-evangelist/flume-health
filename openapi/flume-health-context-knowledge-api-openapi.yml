        last_verified_at:
          type: string
        source_refs:
          type: array
          items:
            type: string
        source_type:
          type: string
          example: curator
        updated_by:
          type: string
        verification_interval:
          type: string
        verified_by:
          type: string
    knowledge.BaseOverviewConflictResponse:
      type: object
      properties:
        a:
          $ref: '#/components/schemas/knowledge.BaseOverviewConflictRefResponse'
        b:
          $ref: '#/components/schemas/knowledge.BaseOverviewConflictRefResponse'
    knowledge.PromotionFreshnessVerdict:
      type: string
      enum:
      - fresh
      - artifact_revised
      - no_artifacts
      - unknown
      x-enum-varnames:
      - FreshnessFresh
      - FreshnessArtifactRevised
      - FreshnessNoArtifacts
      - FreshnessUnknown
    knowledge.ProposalPayload:
      type: object
      properties:
        body:
          type: string
        confidence:
          type: number
        evidence_link:
          description: to the source tool output
          type: string
        fqn:
          type: string
        kind:
          type: string
          example: pitfall
        proposed_target:
          description: proposed attachment
          type: string
        reason:
          type: string
        recall_policy:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.RecallPolicy'
          example: auto
        scope_id:
          type: string
        scope_type:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.KnowledgeScopeType'
          example: account
        sensitivity:
          type: string
        title:
          type: string
    knowledgestore.AppliesToEdge:
      type: object
      properties:
        confidence:
          description: 'Confidence is presence-aware: nil means "no confidence supplied" (the property

            is omitted at persistence), while a non-nil pointer persists its value —

            including a legal 0.0 — so "zero confidence" and "unset" round-trip distinctly

            instead of collapsing to the same stored state.'
          type: number
        created_at:
          type: string
        created_by:
          type: string
        inheritance:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.InheritanceMode'
          example: exact
        inherited:
          description: 'Inherited marks an edge the SERVER wrote on a curator''s behalf rather than one

            a curator''s own :attach call created — today only the supersede-approval copy

            (FL-31324, knowledgemanager.copyPredecessorPlacement). It is persisted as the

            EdgePropInherited property so the distinction survives the write, which is what

            the retry path needs: that copy has no cross-edge transaction (kernel.go:264),

            so a mid-loop failure leaves some edges committed, and without this marker the

            retry reads the server''s own partial write back as the curator''s placement and

            suppresses the rest of the axis. Omitted at persistence when false, so a

            curator''s attach is unmarked and stays theirs.'
          type: boolean
        source_fqn:
          type: string
        target_fqn:
          type: string
    knowledge.GraphPeekNode:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.GraphPeekAttachment'
        badge:
          $ref: '#/components/schemas/knowledgestore.KnowledgeResultBadge'
        body_excerpt:
          type: string
        conflict:
          type: boolean
        fqn:
          type: string
        kind:
          type: string
          example: pitfall
        phi:
          type: boolean
        scope:
          $ref: '#/components/schemas/knowledge.KnowledgeScope'
        title:
          type: string
    knowledgemanager.ReorganizeMerge:
      type: object
      properties:
        fold_fqns:
          type: array
          items:
            type: string
        fold_titles:
          type: array
          items:
            type: string
        keep_fqn:
          type: string
        keep_title:
          type: string
        why:
          type: string
    knowledgemanager.ReorganizeProposal:
      type: object
      properties:
        advice:
          description: Advice holds the merges, splits and links a curator carries out by hand.
          allOf:
          - $ref: '#/components/schemas/knowledgemanager.ReorganizeAdvice'
        considered:
          description: Considered is how many entries the proposer saw.
          type: integer
        dropped:
          description: 'Dropped counts plan lines the validator removed because they named nothing real

            or gave no reason.'
          type: integer
        next_after:
          description: NextAfter is the After value for the next "all" pass, "" when none remain.
          type: string
        plan:
          $ref: '#/components/schemas/knowledgemanager.ReorganizePlan'
        remaining:
          description: 'Remaining is how many matching entries the proposal did not cover because of the

            limit. Run the step again after applying to take the next pass.'
          type: integer
        unassigned:
          description: 'Unassigned lists the considered entries the plan leaves where they are. A model

            that gives no filing for an entry, or a filing the validator drops, ends up here.'
          type: array
          items:
            $ref: '#/components/schemas/knowledgemanager.ReorganizeUnassigned'
    knowledgemanager.AttachInput:
      type: object
      required:
      - inheritance
      properties:
        confidence:
          description: 'Confidence is the optional [0,1] score for the attachment. Omit it to leave

            confidence unset; a supplied value (including 0) is persisted distinctly from

            unset, so "zero confidence" and "no confidence" do not collapse.'
          type: number
        create_target_term:
          description: 'CreateTargetTerm is the zero-candidate confirm step: when a target text

            resolves to no candidate, the curator may confirm creating a :BusinessTerm to

            attach to. When set, the manager mints the term and attaches the source to it in

            one call (the offer→confirm flow), emitting the business-term-fallback metric.'
          allOf:
          - $ref: '#/components/schemas/knowledgemanager.NewBusinessTerm'
        inheritance:
          $ref: '#/components/schemas/knowledgestore.InheritanceMode'
        proceed:
          description: 'Proceed acknowledges a same-kind/same-target conflict warning: the first

            interactive attach returns the warning and writes nothing; a follow-up with

            Proceed=true writes the :APPLIES_TO edge AND records the :CONFLICTS_WITH edge

            (FR-5). It has no effect when no conflict exists.


            The two-call confirm is STATELESS, so Proceed is a blanket acknowledgment of

            WHATEVER CONFLICTS EXIST AT PROCEED TIME, not of the specific conflicts a prior

            call surfaced: a first call with Proceed=true skips the warning entirely, and a

            conflict created between the warn and the proceed is written past without ever

            having been shown. Accepted deliberately — FR-5''s mechanical invariants still

            hold either way (every conflict is detected, recorded as :CONFLICTS_WITH with an

            `attached` audit event, and echoed in the result), so nothing is absorbed

            silently; only the ORDER of "shown" versus "written" differs. If multi-curator

            concurrency arrives, replace this with acknowledged-fqn semantics (e.g.

            proceed_past: [existing_fqns]) rather than widening the blanket flag.'
          type: boolean
        source_fqn:
          type: string
        target_fqns:
          type: array
          items:
            type: string
        target_text:
          type: string
    knowledge.ConflictWarningResp:
      type: object
      properties:
        existing_fqn:
          type: string
        kind:
          type: string
          example: pitfall
        target_fqn:
          type: string
    knowledge.PatchKnowledgeRequest:
      type: object
      properties:
        applicability:
          type: string
        body:
          type: string
        description:
          type: string
        exportable:
          description: 'Exportable is false to keep an area, and everything filed under it, out of

            export (FL-31877). It is valid on an area only.'
          type: boolean
        last_verified_at:
          type: string
        recall_policy:
          $ref: '#/components/schemas/knowledgestore.RecallPolicy'
        status:
          $ref: '#/components/schemas/knowledgestore.KnowledgeStatus'
        tags:
          type: array
          items:
            type: string
        title:
          type: string
        verified_by:
          type: string
    knowledge.GraphPeekAttachment:
      type: object
      properties:
        inheritance:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.InheritanceMode'
          example: exact
        target_fqn:
          type: string
        target_label:
          type: string
    knowledgemanager.AttachResult:
      type: object
      properties:
        additional_conflicts:
          description: 'AdditionalConflicts carries the second-and-later conflicts when multiple

            explicit targets each hit a same-kind active (FR-5: every conflict is

            surfaced, none silently absorbed). Additive so existing consumers of the

            singular field keep working; empty when at most one conflict exists.'
          type: array
          items:
            $ref: '#/components/schemas/knowledgemanager.ConflictWarning'
        conflict_warning:
          $ref: '#/components/schemas/knowledgemanager.ConflictWarning'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/knowledgestore.AppliesToEdge'
        part_of_edges:
          description: 'PartOfEdges are the :PART_OF edges this attach wrote — present when one or more

            target_fqns named an `ontology`-kind knowledge entry (FL-31304). A section

            target never appears in Edges above: it is filed, not applied-to, so it is

            echoed here instead, on its own axis, the same split entityPlacement makes for

            a supersede''s inherited placement.'
          type: array
          items:
            $ref: '#/components/schemas/knowledgestore.PartOfEdge'
    knowledge.KnowledgeListResponse:
      type: object
      properties:
        _meta:
          $ref: '#/components/schemas/knowledge.Meta'
        results:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.KnowledgeEntityWithArtifacts'
    knowledge.FeedbackVote:
      type: string
