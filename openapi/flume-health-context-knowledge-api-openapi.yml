  /api/v1/context/knowledge/turns/{message_id}:
    get:
      description: 'Returns the injected-knowledge panel + RecallTrace payload for a conversation turn (FR-24). A zero-injection turn returns gate_decision=none with no recall_trace. SOURCE: an in-process retention ring serves the hot path, and a ring miss READS THROUGH to the durable injection_audit table in the account''s own bucket (FL-30430), so a turn any replica served is answerable from any replica. That read-through is what makes the empty payload meaningful: gate_decision=none means the turn was not recorded as injecting anything, rather than ''the pod that served it is not this one'' — BUT ONLY WHEN evidence=''not_recorded'', see below. A turn that was never recorded still returns the zero-injection payload, and this endpoint still never 404s for a missing turn. READ `evidence` BEFORE READING ANYTHING ELSE (FL-30627): it says whether this payload is an account of the turn at all. ''recorded'' — a record was found and the payload describes it. ''not_recorded'' — every source was consulted, none holds it, AND a source could have held it, and ONLY under this value does an empty injected set mean the turn injected nothing. SINCE FL-30795 NO DEPLOYED BUILD RETURNS IT: retiring the gateway {knowledge} token left the injection-audit trail with no production writer, so a genuine miss reports ''unavailable'' instead and the workspace''s own client-side injection is not visible to this route at all. It returns to service with FL-30841. Treat it as a value to handle, not one to expect. ''unavailable'' — the record could not be looked for (no durable trail is wired on this instance, or its query endpoint has not deployed), so gate_decision=none and injected=[] are filler that keep the payload well-formed and assert NOTHING; clients MUST render this as ''couldn''t load'', exactly as they render a 503, and never as ''no knowledge applied''. This is the SECOND way this endpoint says ''couldn''t load'' and it arrives as a 200, because failing every read through a deploy-skew window would be worse than degrading. IT CAN ALSO RETURN 503: when the durable read itself fails (timeout, or the account''s injection_audit is unreadable) the endpoint refuses rather than answering empty, because an outage and a turn that injected nothing are opposite claims — clients MUST render 503 as ''couldn''t load'', never as ''no knowledge applied''. An id that is not in the minted-id alphabet is refused with 400 before any lookup — that is a malformed request, not an outage, and retrying it will never succeed. ADDRESSING: the gateway mints a per-turn message id and returns it as the X-Flume-Message-Id response header on the LLM proxy call that served the turn (FL-30412) — read it there and address this route with it. A conversation id is also accepted, for clients that do not read that header yet, and resolves to that conversation''s MOST RECENT retained turn — correct for a dock rendering the live answer, wrong for one pinned to an older answer. PER-ITEM FIDELITY: title, kind and scope are re-read from the entity at request time, so they reflect the entity NOW rather than at turn time; badge.freshness, conflict and phi are computed during retrieval and are NOT carried by the audit record, so they are absent/false here rather than recomputed from a second, divergable opinion.'
      tags:
      - Context Knowledge
      summary: Get injected knowledge for a turn
      operationId: getTurnKnowledge
      parameters:
      - description: Message id segment of the turn — the opaque id only, not a slash-bearing resource name (chi path params cannot contain a slash). Take it from the X-Flume-Message-Id response header of the LLM proxy call that served the turn. A conversation id is also accepted and resolves to that conversation's most recent retained turn.
        name: message_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.TurnKnowledgePayload'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
