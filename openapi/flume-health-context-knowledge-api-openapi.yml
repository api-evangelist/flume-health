      description: 'Right-to-erasure. Empties every content-bearing surface on the entity — title, description, body, applicability, tags, source refs and the curator-typed attribution fields — regenerates the node vector from those emptied values, retires the entity so no retrieval channel returns it, and appends a terminal `erased` event to the append-only audit log as a redacted tombstone. Distinct from delete/tombstone, which redact the body only and keep the prose surfaces. Two things it does NOT do, both reported in the response rather than implied: the ROW is not removed (context-db exposes no vertex-delete, so a content-free shell keyed by the opaque id remains), and the BYTES are not gone when this returns (storage is copy-on-write, so the pre-erasure version persists until a maintenance sweep compacts it out and prunes the versions that referenced it, and a background sweep can do that only once the old version ages past retention and any object lock on the bucket, so there is no timeline to quote). See docs/knowledge-erasure-semantics.md for the byte timeline per bucket class.'
