openapi: 3.2.0
info:
  description: 'The API for Relay by Flume Health.


    For more information about how Flume can power your health plan, please contact us.


    Redoc | Swagger - Try It'
  title: Flume Console Context Knowledge API
  contact: {}
  version: '1.0'
  x-logo:
    altText: Flume Health
    url: https://public-static.flume.health/front/logo-margin-512.png
servers:
- url: https://console.flumehealth.com/
- url: http://console.flumehealth.com/
tags:
- name: Context Knowledge
paths:
  /api/v1/context/knowledge:
    get:
      description: 'Lists curated knowledge for the authenticated account, each entity with a metadata-only summary of its linked artifacts (FL-30678), ordered by fqn and filterable by scope, kind, status, and fqn-prefix. The agent reads knowledge via graph-search/graph-query (K1); this is the CURATOR/manage surface. One curator-scoped rule applies: a NON-curator never sees status=proposed rows (unapproved content is what the review-queue and proposal-list gates protect, and an inventory must not route around them); a non-curator filtering for proposed gets an empty list, not an error. The result is BOUNDED (limit defaults to 200, ceiling 1000) and the envelope carries no cursor, so an account past the ceiling is truncated — the truncation is logged server-side, and wire pagination is the fix rather than a larger bound.'
      tags:
      - Context Knowledge
      summary: List knowledge
      operationId: listKnowledge
      parameters:
      - description: Filter by scope type (flume_core, account, workspace, user, session)
        name: scope
        in: query
        schema:
          type: string
      - description: Filter by kind. Matched exactly and NOT validated against a closed set — kind is open-with-declaration (G8), so an account's declared kind:ontology values are legal filter values.
        name: kind
        in: query
        schema:
          type: string
      - description: Filter by lifecycle status (proposed, active, superseded, archived, rejected, tombstoned)
        name: status
        in: query
        schema:
          type: string
      - description: Filter by fqn prefix (opaque, store-minted knowledge/{id}; C16)
        name: fqn_prefix
        in: query
        schema:
          type: string
      - description: Max entities to return (default 200, ceiling 1000)
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.KnowledgeListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
    post:
      description: 'Creates a knowledge entity. account_id comes from request context, fqn is store-minted (C16), and curator_role from auth — none may be supplied in the body. TWO paths share this route by a body-value dispatch on status (AIP: not a bespoke verb): the default status=active is the CURATOR-gated create, while status=proposed is the save-this proposal (FL-29879) — NOT curator-gated, any authenticated author may propose. A proposal lands status=proposed plus one review_items row and is never retrieval-eligible until a curator approves it via the row-scoped review-items/{review_item_id}:approve. The propose-only evidence fields (proposed_target, sensitivity, verification_interval) are accepted ONLY with status=proposed; the source evidence link rides in source_refs, which already documents exactly that purpose.'
      tags:
      - Context Knowledge
      summary: Create a knowledge entity
      operationId: createKnowledge
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledgestore.KnowledgeEntity'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/knowledgemanager.CreateKnowledgeInput'
        description: Knowledge to create
        required: true
  /api/v1/context/knowledge/artifacts:
    post:
      description: Persists a content-addressed :Artifact (code/document/image). Identity is the content_hash (derived from the payload; a supplied hash is verified). Byte-identical content dedups to one row (FR-33). Raw PHI bytes are never injected — only the sanitized extracted_text is embedded/injected. A binary artifact's `bytes` are retained (FL-30227), stored against the content_hash outside the graph and served only through GET /api/v1/context/knowledge/artifacts/{content_hash}/content, which is role- and sensitivity-gated. Identity, size, media_type, extracted_text, and sensitivity/scope persist on the artifact itself.
      tags:
      - Context Knowledge
      summary: Create a content-addressed artifact
      operationId: createKnowledgeArtifact
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.CreateArtifactResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/knowledge.CreateArtifactRequest'
        description: Artifact to create
        required: true
  /api/v1/context/knowledge/artifacts/{content_hash}:
    delete:
      description: 'Erases a knowledge artifact. SystemAdmin-only, and deliberately NOT open to the account''s own Admin, who curates the rest of this facade by role — so this is stricter than the rest of this facade''s curator writes. It destroys the stored payload with no undo, and the payload read (GET .../content) already refuses an account Admin any artifact that is phi_bearing, unclassified, or scoped narrower than the account, because an :Artifact carries no scope_id to match a requester against; admitting that caller to the delete would let them destroy bytes they are refused a look at. WHAT THIS DELIVERS: the :Artifact row is marked erased and its content-bearing fields (source, extracted_text) are emptied, its revision edges are severed, and the stored payload is removed — after which every governed read answers not-found. TWO THINGS IT DOES NOT DELIVER, both stated in the response rather than implied away. The graph ROW is not removed: context-db has no vertex delete, so an erasure marks the row, and physical removal is a later sweep (FL-30445); `record_semantics` says so on every call. And the payload bytes are not reclaimed: Lance records a deletion vector rather than rewriting the fragment, so the bytes remain in the customer bucket and in older dataset versions until compaction and version cleanup run; `semantics` relays the storage layer''s own sentence and bytes_reclaimed is always false. Refused with 409 while any knowledge entity still references the artifact, or while any later revision names it as a predecessor — unlink or retract those first. Deleting an artifact that does not exist is a 404; re-deleting one already erased is a 200 that records no second erasure and re-attempts whatever the first call left unfinished. One `erased` audit event is written, before anything is removed and only on the first erasure.'
      tags:
      - Context Knowledge
      summary: Delete a knowledge artifact
      operationId: deleteKnowledgeArtifact
      parameters:
      - description: Artifact content hash (sha256- followed by 64 lowercase hex characters)
        name: content_hash
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.DeleteArtifactResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '409':
          description: still referenced, or has later revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '500':
          description: partial delete — the message names which half survived and whether a re-run is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/artifacts/{content_hash}/content:
    get:
      description: Streams the raw bytes of a stored binary artifact, addressed by content_hash. Requires Editor or above; a phi_bearing or unclassified artifact additionally requires a curator (SystemAdmin). Returns 404 when no payload is stored — including for artifacts created before payload persistence existed, whose bytes were discarded and cannot be recovered except by re-creating the artifact from the same content. Raw bytes are never injected or embedded; only the sanitized extracted_text is.
      tags:
      - Context Knowledge
      summary: Download a binary artifact's payload
      operationId: getKnowledgeArtifactContent
      parameters:
      - description: Artifact content hash (sha256-…)
        name: content_hash
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The artifact payload
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/base/graph:
    get:
      description: 'Returns the knowledge graph around focus (a knowledge id) or, when focus is omitted, around the account root: sections and the entries filed under them (generated `path:` folders included, marked `generated`), every stored relationship between two entries the caller can see (SUPERSEDES, CONFLICTS_WITH, knowledge-to-knowledge APPLIES_TO), and each entry''s APPLIES_TO attachment to an estate object as its own node (`node_type` estate, term, or account). Every node name resolves server-side, never a bare fqn. `depth` is how many levels below the focus unfold: for the root, 1 is the top-level sections, 2 adds what is filed directly under them; omitted or 0 means every level of the base under the focus; an explicit depth is capped at 5. A leaf focus returns its placement, its relationships in both directions, and its attachments. The response is capped at 500 nodes; a capped answer has `truncated: true`, `truncation_reason: node_cap`, and `total_nodes`. A base filed deeper than `depth` answers `truncated: true` with `truncation_reason: depth`, so `truncated: false` is the only reading of "this is everything under the focus". `truncation_reason` is one of four: `entity-ceiling` or `page-budget` when the corpus is larger than one scan can see, then `node_cap`, then `depth` — widest cut first. Gated and PHI-withheld exactly like the tree and the page read: an edge is drawn only between two nodes of the response, so a withheld or out-of-project entry is never named.'
      tags:
      - Context Knowledge
      summary: Read the knowledge base graph neighbourhood
      operationId: getKnowledgeBaseGraph
      parameters:
      - description: Knowledge id to center the neighbourhood on (opaque; omit for the account root)
        name: focus
        in: query
        schema:
          type: string
      - description: levels below the focus to unfold; omitted or 0 means every level; max 5
        name: depth
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.BaseGraphResponse'
        '400':
          description: depth is not a non-negative integer, or focus contains a single quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: knowledge read/inject is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/base/history:
    get:
      description: Returns one entry's in-place edits, newest first. Each edit names the changed fields and carries each field's value before and after the edit, the editor's display name (never an email or raw id) and the edit time. Gated like /base/page — an entry the page would not serve (absent, foreign, scope-unreadable, not active, or PHI-withheld) answers not_found — plus the curator gate, because a history holds content an edit removed. An erased entry's history is redacted with the entry. At most 200 edits are returned; truncated reports that older edits were left out.
      tags:
      - Context Knowledge
      summary: Read one knowledge entry's edit history
      operationId: getKnowledgeBaseHistory
      parameters:
      - description: Knowledge id (opaque; the full fqn is knowledge/{id}, C16)
        name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.BaseHistoryResponse'
        '400':
          description: id is required, or contains a single quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: the caller is not a curator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: knowledge read/inject is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/base/overview:
    get:
      description: 'Returns the account-level Base summary: counts (entries, sections, unfiled, verified-and-current, attached-to-data), the open review-queue count, entries past their own verification_interval, and conflict pairs (an explicit CONFLICTS_WITH edge, or two active `definition` entries attached to the same target) — one small round trip for the Overview screen''s "needs attention" surfaces. Gated like the tree, the page and the graph: every account user who can engage with knowledge may read it. Two fields the SPA has asked for are not on this response because no reliable source exists yet: per-entry recent activity (no audit-log read exists by account or by fqn) and a 30-day usage count (the injection-audit read is turn-addressed, not account-scoped) — see the PR that added this route.'
      tags:
      - Context Knowledge
      summary: Read the knowledge base overview
      operationId: getKnowledgeBaseOverview
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.BaseOverviewResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '422':
          description: 'limit_exceeded: the account''s edges are too numerous for one read'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: knowledge read/inject is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/base/page:
    get:
      description: 'Returns one entry''s frontmatter — with applies_to_labels and section_titles resolved server-side, by NAME, never a UUID — plus its markdown body. Honours If-None-Match with 304 against the entry''s own ETag (derived from its updated stamp AND a digest of its edge-derived fields — section_fqns, section_titles, applies_to — so re-filing the entry or renaming its parent section invalidates the cache even though neither touches the entry''s updated stamp); the etag is also returned as the ETag response header. Gated and PHI-withheld exactly like the tree and the markdown export: a phi_bearing/phi_adjacent entry, or one linking an unclassified/missing artifact, answers not_found — never a 403 that would confirm the fqn exists.'
      tags:
      - Context Knowledge
      summary: Read one knowledge base page
      operationId: getKnowledgeBasePage
      parameters:
      - description: Knowledge id (opaque; the full fqn is knowledge/{id}, C16)
        name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.BasePageResponse'
        '304':
          description: the page is unchanged since the If-None-Match etag
        '400':
          description: id is required, or contains a single quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: knowledge read/inject is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/base/tree:
    get:
      description: 'Returns the account''s knowledge as a tree rooted at the account knowledge root (D43): sections, entry titles, kinds, counts, and updated stamps, with a view selector — `hierarchy` (default, the :PART_OF chain from the root), `estate` (server > database > schema > table, from applies_to), `kind`, `tags`, or `recent`. Every node name resolves by NAME, never a UUID. `page_size` bounds how many entries each flat group (recent, or each kind/tag/estate bucket) returns; `page_token` is accepted for forward compatibility and not yet used — a hierarchy is read as one complete tree per call. Gated like the markdown export: every account user who can engage with knowledge may read it.'
      tags:
      - Context Knowledge
      summary: Read the knowledge base hierarchy
      operationId: getKnowledgeBaseTree
      parameters:
      - description: hierarchy (default), estate, kind, tags, or recent
        name: view
        in: query
        schema:
          type: string
      - description: caps entries per flat group; default and ceiling both 1000
        name: page_size
        in: query
        schema:
          type: integer
      - description: reserved for future use
        name: page_token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.BaseTreeResponse'
        '400':
          description: view names something other than hierarchy, estate, kind, tags, or recent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '422':
          description: 'limit_exceeded: the account''s edges are too numerous for one read'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: knowledge read/inject is not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/graph:
    get:
      description: 'Returns the read-only knowledge graph (nodes + edges) for the graph view (FR-25). Read-only: mutation happens on the manage surface. Not yet implemented (501).'
      tags:
      - Context Knowledge
      summary: Get the read-only knowledge graph
      operationId: getKnowledgeGraph
      parameters:
      - description: Filter by scope type
        name: scope
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.KnowledgeGraphResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '501':
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/prefix:
    get:
      description: 'Returns the near-static {ontology} schema-card and the debounced/versioned {index} block with their current versions, for the gateway proxy flow to attach to the cached system-prefix (FR-34). These blocks are read-side only: they do NOT pass the per-turn relevance gate or count against the per-turn budget. Gated by knowledge_read_inject; with the flag off the endpoint returns 503 (read-off rollback).'
      tags:
      - Context Knowledge
      summary: Get the stable knowledge prefix blocks
      operationId: getKnowledgePrefix
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.KnowledgePrefixResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/proposals:
    get:
      description: Lists status=proposed knowledge items awaiting curator review (FR-7, FR-27). Account-isolated and CURATOR-GATED (a non-curator gets 403, even though the route-level policy admits editors) — the list carries unapproved proposal content. Each entry is hydrated from the LIVE :Knowledge node, so a curator's edits before approval are what the queue shows; the reason comes from the review row.
      tags:
      - Context Knowledge
      summary: List knowledge proposals
      operationId: listKnowledgeProposals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.ProposalListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/review-items:
    get:
      description: Returns the account's curator review queue (proposed_knowledge, bulk_seed_ambiguity and feedback_flag rows) for the review-queue UI (Story 5.2, pulled into v1), optionally filtered by status. Account-isolated and CURATOR-GATED (a non-curator gets 403, even though the route-level policy admits editors).
      tags:
      - Context Knowledge
      summary: Get the curator review queue
      operationId: getKnowledgeReviewQueue
      parameters:
      - description: Filter by review status (open, accepted, rejected, dismissed)
        name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/knowledge.ReviewQueueResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
  /api/v1/context/knowledge/review-items/{review_item_id}/promotion-preflight:
    get:
