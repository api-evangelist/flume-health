    knowledgestore.InheritanceMode:
      type: string
      enum:
      - exact
      - descendants
      x-enum-varnames:
      - InheritanceExact
      - InheritanceDescendants
    knowledge.EntityProvenance:
      type: object
      properties:
        authored_by:
          type: string
        confidence:
          type: number
        corroborated_by:
          type: array
          items:
            type: string
        created_by:
          type: string
        curator_role:
          type: string
