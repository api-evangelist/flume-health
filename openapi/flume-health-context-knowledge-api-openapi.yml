  /api/v1/context/knowledge:reconcile-hierarchy:
    post:
      description: 'Creates the account''s knowledge root and its system Unfiled section if either is absent, restores either one that exists but has drifted to a non-active or non-ontology state (`singletons_repaired`), files Unfiled under the root, and attaches a :PART_OF edge (the root for a section, Unfiled for anything else) to every ACTIVE existing node this scan finds with no :PART_OF edge at all (FL-31444). Idempotent: a second run against an already-reconciled account creates and places nothing. Draft, rejected, tombstoned, archived, and superseded nodes are never swept. The node scan is bounded: when an account has more knowledge vertices than one pass can read, the report returns `truncated: true` and the unscanned tail keeps no :PART_OF edge — re-running does not reach it, because the scan takes no cursor. SystemAdmin only — the same account-wide maintenance gate the erasure sweep uses, not the ordinary curator grant.'
