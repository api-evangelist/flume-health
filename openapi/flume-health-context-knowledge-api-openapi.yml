          type: string
        recall_policy:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.RecallPolicy'
          example: auto
        status:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.KnowledgeStatus'
          example: active
        supersedes_fqn:
          type: string
        valid_from:
          type: string
        valid_to:
          type: string
    knowledge.SetPublishingPolicyRequest:
      type: object
      properties:
        knowledge_publishing:
          enum:
          - review_required
          - writers_publish
          allOf:
          - $ref: '#/components/schemas/knowledgemanager.KnowledgePublishing'
    knowledge.KnowledgeGraphNode:
      type: object
      properties:
        badges:
          $ref: '#/components/schemas/knowledge.GraphNodeBadges'
        fqn:
          type: string
        id:
          type: string
