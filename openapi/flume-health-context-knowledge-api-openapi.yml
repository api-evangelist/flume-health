        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/knowledgemanager.BulkWriteInput'
        description: Bulk manifest
        required: true
components:
  schemas:
    knowledge.KnowledgePrefixResponse:
      type: object
      properties:
        index:
          $ref: '#/components/schemas/knowledge.KnowledgePrefixBlock'
        ontology:
          $ref: '#/components/schemas/knowledge.KnowledgePrefixBlock'
    knowledge.GraphNodeBadges:
      type: object
      properties:
        conflict:
          type: boolean
        freshness:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.FreshnessBand'
          example: fresh
        phi:
          type: boolean
        status:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.KnowledgeStatus'
          example: active
    knowledgemanager.KnowledgeWriteErrorCode:
      type: string
      enum:
      - invalid_input
      - disambiguation_required
      - conflict
      - scope_forbidden
      - not_found
      - internal
      x-enum-varnames:
      - KnowledgeWriteInvalidInput
      - KnowledgeWriteDisambiguationRequired
      - KnowledgeWriteConflict
      - KnowledgeWriteScopeForbidden
      - KnowledgeWriteNotFound
      - KnowledgeWriteInternal
    knowledgestore.ReviewItemStatus:
      type: string
      enum:
      - open
      - accepted
      - rejected
      - dismissed
      x-enum-varnames:
      - ReviewOpen
      - ReviewAccepted
      - ReviewRejected
      - ReviewDismissed
    knowledge.KnowledgeGraphResponse:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.KnowledgeGraphEdge'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/knowledge.KnowledgeGraphNode'
    knowledge.EntityLifecycle:
      type: object
      properties:
        last_validated_against_schema:
          type: string
        recall_policy:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.RecallPolicy'
          example: auto
        status:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.KnowledgeStatus'
          example: active
        supersedes_fqn:
          type: string
        valid_from:
          type: string
        valid_to:
          type: string
    knowledgestore.InheritanceMode:
      type: string
      enum:
      - exact
      - descendants
      x-enum-varnames:
      - InheritanceExact
      - InheritanceDescendants
    knowledgestore.KnowledgeEntity:
      type: object
      properties:
        account_id:
          type: string
          example: '12345'
        applicability:
          type: string
        authored_by:
          type: string
        body:
          type: string
          x-body-soft-cap-warning: true
        confidence:
          type: number
        corroborated_by:
          type: array
          items:
            type: string
        created_at:
          type: string
        created_by:
          type: string
        curator_role:
          type: string
          example: system_admin
        description:
          type: string
          example: Rows written before 2021-03 have a null paid_amt.
        fqn:
          type: string
          example: knowledge/019f8899-d6c2-761f-9019-4ad5e8167402
        kind:
          type: string
          example: pitfall
        knowledge_scope_id:
          type: string
          example: '12345'
        knowledge_scope_type:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.KnowledgeScopeType'
          example: account
        last_validated_against_schema:
          type: string
        last_verified_at:
          type: string
        recall_policy:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.RecallPolicy'
          example: auto
        source_refs:
          type: array
          items:
            type: string
        source_type:
          type: string
          example: curator
        status:
          allOf:
          - $ref: '#/components/schemas/knowledgestore.KnowledgeStatus'
          example: active
        supersedes_fqn:
          type: string
        tags:
          type: array
          items:
            type: string
        title:
          type: string
          example: paid_amt is null before the 2021 migration
        updated_at:
          type: string
        updated_by:
          type: string
        valid_from:
          type: string
        valid_to:
          type: string
        verification_interval:
          type: string
        verified_by:
          type: string
    knowledgemanager.BulkItem:
      type: object
      required:
      - payload
      properties:
        inheritance:
          $ref: '#/components/schemas/knowledgestore.InheritanceMode'
        payload:
          $ref: '#/components/schemas/knowledgemanager.CreateKnowledgeInput'
        target_fqn:
          type: string
        target_text:
          type: string
    knowledge.KnowledgeGraphNode:
      type: object
      properties:
        badges:
          $ref: '#/components/schemas/knowledge.GraphNodeBadges'
        fqn:
          type: string
        id:
          type: string
        kind:
          type: string
          example: pitfall
        label:
          type: string
          example: Knowledge
    knowledgestore.KnowledgeResultBadge:
      type: object
      properties:
        freshness:
