  /api/v1/context/knowledge:erasure-sweep:
    post:
      description: 'Compacts and prunes every Lance dataset under the requesting account''s graph warehouse, forcing materialization of every deletion, so the bytes behind erased knowledge entities leave storage. This is the second half of `:erase`, which cannot do it: storage is copy-on-write, so writing over a row does not unwrite the bytes it replaced. Also sweeps the knowledge datasets in the customer storage root (review queue, audit logs), where an erased entry''s redacted review row leaves superseded bytes. Erasure completes across AT LEAST TWO sweeps rather than one call — a sweep cannot prune the versions it just wrote, so a `bytes_removed` of 0 is a normal result and a later run reclaims once the pre-erasure versions age past the retention window. If context-db refuses the sweep for a missing MAINTAIN grant, the response is 200 with `complete: false` and a detail naming POST /api/v1/context/grants:reconcile. SystemAdmin-only in the manager, and deliberately NOT open to the account''s own Admin, who curates the corpus by role: the sweep rewrites the whole warehouse and destroys bytes, which is authority over the substrate rather than over the corpus. A 409 has two causes, and only one of them is overridable: context-db deferred because a scan is writing the same datasets (retry later, not a failure — an operator on a deadline can re-run with `{"quiesce_secs": 0}` to sweep anyway), or a sweep is already running for this account on this API instance (wait for it; `quiesce_secs` cannot clear this one, because the sweep survives the request that started it and stacking retries is what the guard prevents). That in-flight guard is per-instance, not per-deployment. The body is optional and `quiesce_secs` is the only field on it; nothing a request sends can weaken what the sweep does. See docs/knowledge-erasure-semantics.md.'
