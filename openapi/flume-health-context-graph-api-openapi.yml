          description: "Flags selects which knowledge flags this call manages:\n  - \"default\" (also the empty value): the AD-24 capability flags this\n    action manages (graphreconcile.FlagKeys), plus knowledge_staff_only\n    — written FIRST — but only while this account's capabilities are\n    not already live. A customer account reconciled for the first time\n    with an empty body comes out restricted to Flume staff, never open\n    to its own users by omission. Once capabilities ARE live,\n    knowledge_staff_only is left alone entirely: its absence there may\n    be a deliberate release (see its own doc — there is no \"false\" that\n    lifts it, only a DELETE), and an ordinary reconcile call must never\n    re-restrict a released account.\n  - \"default-internal\": FlagKeys' capability flags only, unconditionally\n    skipping knowledge_staff_only. For an account with NO external users\n    (Flume's own account is the example) — an explicit, named choice,\n    not something a caller falls into by leaving the field blank.\n  - \"none\": manage no flags at all — the escape hatch for a customer\n    account provisioned dark, ahead of its launch."
