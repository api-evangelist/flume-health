      security:
      - OAuth2Implicit:
        - openid
        - profile
        - email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/objectinstance.UpdateModel'
        description: Instance Body
        required: true
  /api/v1/objects/{objId}/instances:bulk:
    post:
      description: Creates Bulk Instances
      tags:
      - Objects
      summary: Create Bulk Instances
      operationId: createBulkInstances
      parameters:
      - description: X-Flume-Account-ID
        name: X-Flume-Account-ID
        in: header
        schema:
          type: string
      - description: id of the object
        name: objId
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ErrorResponse'
      security:
      - OAuth2Implicit:
        - openid
        - profile
        - email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/objectinstance.BulkWriteModel'
        description: Instance Bodies
        required: true
components:
  schemas:
    objectinstance.ObjectSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    objectinstance.ReadModel:
      type: object
      required:
      - canonicalValue
      - connectionIds
      - jobIds
      - name
      properties:
        canonicalValue:
          type: string
        connectionCustomValues:
          $ref: '#/components/schemas/objectinstance.CustomValuesByConnection'
        connectionIds:
          type: array
          uniqueItems: true
          items:
            type: integer
        id:
          type: integer
        jobIds:
          type: array
          uniqueItems: true
          items:
            type: integer
        name:
          type: string
        object:
          $ref: '#/components/schemas/objectinstance.ObjectSummary'
    endpoint.DataType:
      type: string
      enum:
      - Accumulators
      - Authorizations
      - Bytes
      - Eligibility
      - Groups
      - MedicalClaimServiceLines
      - Providers
      - RxClaimServiceLines
      - MedicalAndRxClaimLines
      - Test
      - TransactionMetadata
      - Generic
      - RecordLevelMetadata
      - PlanNetworks
      - ProviderNetworkDirectory
      - HmClaimsExtended
      - HmProvidersExtended
      - Strings
      x-enum-varnames:
      - DataTypeAccumulators
      - DataTypeAuthorizations
      - DataTypeBytes
      - DataTypeEligibility
      - DataTypeGroups
      - DataTypeMedicalClaimServiceLines
      - DataTypeProviders
      - DataTypeRxClaimServiceLines
      - DataTypeMedicalAndRxClaimLines
      - DataTypeTest
      - DataTypeTransactionMetadata
      - DataTypeGeneric
      - DataTypeRecordLevelMetadata
      - DataTypePlanNetworks
      - DataTypeProviderNetworkDirectory
      - DataTypeHmClaimsExtended
      - DataTypeHmProvidersExtended
      - DataTypeStrings
    objectinstance.CustomValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    objectinstance.BulkWriteModel:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/objectinstance.WriteModel'
    object.UpdateModel:
      type: object
      properties:
        canonicalColumns:
          type: array
          items:
            $ref: '#/components/schemas/object.CanonicalColumn'
        name:
          type: string
    object.CanonicalColumn:
      type: object
      required:
      - column
      - dataType
      properties:
        column:
          type: string
        dataType:
          $ref: '#/components/schemas/endpoint.DataType'
    objectinstance.CustomValuesByConnection:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/objectinstance.CustomValue'
    objectinstance.WriteModel:
      type: object
      required:
      - canonicalValue
      - connectionIds
      - jobIds
      - name
      properties:
        canonicalValue:
          type: string
        connectionCustomValues:
          $ref: '#/components/schemas/objectinstance.CustomValuesByConnection'
        connectionIds:
          type: array
          uniqueItems: true
          items:
            type: integer
        jobIds:
          type: array
          uniqueItems: true
          items:
            type: integer
        name:
          type: string
    objectinstance.UpdateModel:
      type: object
      properties:
        canonicalValue:
          type: string
        connectionCustomValues:
          $ref: '#/components/schemas/objectinstance.CustomValuesByConnection'
        connectionIds:
          type: array
          uniqueItems: true
          items:
            type: integer
        jobIds:
          type: array
          uniqueItems: true
          items:
            type: integer
        name:
          type: string
    responses.ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        details:
          type: array
          items:
            type: string
        message:
          type: string
    object.ReadModel:
      type: object
      required:
      - canonicalColumns
      - name
      properties:
        canonicalColumns:
          type: array
          items:
            $ref: '#/components/schemas/object.CanonicalColumn'
        id:
          type: integer
        name:
          type: string
        numInstances:
          type: integer
    object.ListResponse:
      type: object
      properties:
        nextPageToken:
          type: string
        objects:
          type: array
          items:
            $ref: '#/components/schemas/object.ReadModel'
    objectinstance.ListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/objectinstance.ReadModel'
        nextPageToken:
          type: string
    object.WriteModel:
      type: object
      required:
      - canonicalColumns
      - name
      properties:
        canonicalColumns:
          type: array
          items:
            $ref: '#/components/schemas/object.CanonicalColumn'
        name:
          type: string
  securitySchemes:
    OAuth2Implicit:
      type: oauth2
      flows:
        implicit:
          scopes:
            email: User email address
            openid: OpenID Connect scope
            profile: User profile information
          authorizationUrl: https://auth.flumehealth.com/authorize?audience=https://console.flumehealth.com/api
