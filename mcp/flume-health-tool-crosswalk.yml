note: 'Flume Health ships BOTH a 153-operation REST contract and a remote MCP endpoint, so a crosswalk is in scope. But
  the MCP tool list is OAuth-gated: POST tools/list to https://console.flumehealth.com/api/v1/context/mcp returns HTTP 401
  with an RFC 9728 Bearer challenge, and Flume publishes no tool catalog, no MCP docs page, and no llms.txt. There is therefore
  NOTHING to bind REST operations to. crosswalk[] is deliberately empty rather than guessed - inventing tool names to fill
  it would manufacture an agent surface Flume has not published. What IS knowable and recorded below: the MCP endpoint lives
  inside the /api/v1/context/ namespace of the same API, whose REST siblings (Context Discovery, Context Graph, Context
  Knowledge) are the 54 operations most likely to back its tools. That is a lead for an authenticated re-run, not a mapping.'
