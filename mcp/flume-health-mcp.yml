summary: >-
  Flume Health runs a remote Model Context Protocol server at https://console.flumehealth.com/api/v1/context/mcp.
  It was not found in any directory, registry, docs page, or llms.txt — it was discovered by probing
  /.well-known/oauth-protected-resource on the Flume Console host, which names the MCP endpoint as its protected
  resource. The endpoint is live and OAuth-protected: an unauthenticated JSON-RPC POST returns HTTP 401 with
  `WWW-Authenticate: Bearer resource_metadata="https://console.flumehealth.com/.well-known/oauth-protected-resource"`,
  which is the RFC 9728 discovery pattern MCP clients follow. The live tool list therefore requires an authenticated
  introspection and is NOT recorded here. Flume publishes no MCP tool documentation and no llms.txt, so no tool
  names or inputSchemas exist to fall back on — recording any would be fabrication.

