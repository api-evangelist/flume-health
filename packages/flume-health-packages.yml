note: >-
  Flume Health publishes no client libraries in any public package registry. Its own developers page claims
  "Python and TypeScript SDKs with type-safe clients, retry logic, and streaming support" and shows code samples,
  but nothing behind that claim is installable: npm has no flume-health, @flumehealth/*, or flume-relay package;
  PyPI has no flume-health, flumehealth, flume-sdk, or flume-relay project; and the company's GitHub organization
  (github.com/flumehealth, which does exist) has ZERO public repositories. The same page advertises a CLI with
  `trace`, `impact`, `recover` and `status` commands and REST endpoints /api/v1/trace, /api/v1/impact,
  /api/v1/recover, /api/v1/audit and /api/v1/status — none of which exist in Flume's actual published contract
  (openapi/flume-health-console-api-openapi.yml). That page is marketing copy describing a product surface Flume has
  not shipped publicly, so nothing from it is recorded as a package here. An integrator's only real option today is
  raw HTTP against the Swagger 2.0 contract.
