aid: flume-health
name: Flume Health
description: Flume Health is a New York based healthcare data platform for the payer ecosystem. Its Relay product is an
  integration platform (iPaaS) that maps eligibility, claims, and other health plan data between source and destination
  Endpoints — SFTP, cloud storage, databases, Snowflake, and APIs — through a canonical Flume Data Model, with Connections,
  Shards, Transactions, and mapping jobs managed from the Flume Console. A newer Context layer adds a knowledge graph over
  a customer's data estate, natural-language query, and domain agents for actuarial, claims, coding, and compliance work,
  exposed to AI clients through an OAuth-protected Model Context Protocol endpoint. The public Flume Console API is a 153-operation
  Swagger 2.0 contract served from console.flumehealth.com, authenticated with OpenID Connect / OAuth 2.0 at auth.flumehealth.com.
  Flume sold its third-party administrator operations to Vitori Health in 2023 to focus on the software platform.
