apis:
- name: Flume Console API
  description: The REST API for Relay by Flume Health. Manages Accounts, Account Contracts, Connections, Endpoints and their
    per-protocol secrets and tests (API, cloud storage, database, SFTP, Snowflake, Flume Lakehouse), Endpoint Maps, Shards,
    Transactions, Source Files, Business Objects and Instances, Users, Flags, Worker Sizes, Reports, Telemetry, and v2 trade/automap
    jobs — plus the Context Discovery, Context Graph, and Context Knowledge surfaces. Swagger 2.0, 153 operations across
    108 paths, OAuth 2.0 / OIDC bearer auth, account scoping via the X-Flume-Account-ID header, and pageToken/pageSize cursor
    pagination.
  humanURL: https://console.flumehealth.com/api/docs
  baseURL: https://console.flumehealth.com/
