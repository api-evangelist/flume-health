- name: Flume Context MCP Server
  description: A remote Model Context Protocol endpoint served by the Flume Console at /api/v1/context/mcp. It is protected
    by OAuth 2.0 and advertises RFC 9728 protected-resource metadata, returning a 401 with a WWW-Authenticate Bearer challenge
    and a resource_metadata pointer to unauthenticated callers, so the live tool list requires an authenticated introspection.
    Discovered by probe; Flume publishes no MCP documentation page.
  humanURL: https://www.flumehealth.com/developers
  baseURL: https://console.flumehealth.com/api/v1/context/mcp
